<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio single-page website built with Vue, Tailwind, and TypeScript."
    />
    <title>Portfolio</title>

    <!-- Preload critical self-hosted font for instant rendering -->
    <link
      rel="preload"
      href="/fonts/sf-pro-display-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://media.hafizfs.my.id" crossorigin />
    <link rel="dns-prefetch" href="https://media.hafizfs.my.id" />
    <link rel="dns-prefetch" href="https://drive.google.com" />

    <!-- Preload critical above-fold hero image for instant LCP -->
    <link
      rel="preload"
      href="/resources/hero/photo.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
